name: realtime-location-tracking

x-redis-env: &redis-env
  Redis__ConnectionString: redis:6379
  Redis__KeyPrefix: tracking

x-analytics-db: &analytics-db
  ConnectionStrings__Analytics: Host=postgres;Port=5432;Database=tracking_analytics;Username=tracking;Password=tracking

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:9092; the host uses
  # localhost:9092, so services started with `dotnet run` reach the same broker.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: HGBqyPxITYa4dA1ftCX4_A # any base64-encoded UUID; fixed so the data volume stays valid
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by kafka-init, with the intended partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the analytics topics once the broker is up. Both are keyed by device id, so the partition
  # count bounds how many analytics consumers can share the work.
  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in tracking.positions.v1 tracking.geofence-events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists             --topic "$$topic" --partitions 6 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracking_analytics
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: .
      dockerfile: src/Tracking.Ingest/Dockerfile
    image: tracking-ingest:local
    environment:
      <<: *redis-env
    ports:
      - "5100:8080" # gRPC (HTTP/2)
      - "5101:8081" # health
    depends_on:
      redis:
        condition: service_healthy

  processor:
    build:
      context: .
      dockerfile: src/Tracking.Processor/Dockerfile
    image: tracking-processor:local
    environment:
      <<: *redis-env
      Kafka__BootstrapServers: kafka:9092
    # Two consumers in the same group; each uses its container hostname as the consumer name.
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Consumes the analytics topics into PostgreSQL and applies the schema migrations on start.
  analytics:
    build:
      context: .
      dockerfile: src/Tracking.Analytics/Dockerfile
    image: tracking-analytics:local
    environment:
      <<: *analytics-db
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5400:8080" # health and metrics
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: src/Tracking.Api/Dockerfile
    image: tracking-api:local
    environment:
      <<: [*redis-env, *analytics-db]
    ports:
      - "5200:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: src/Tracking.Simulator/Dockerfile
    image: tracking-simulator:local
    environment:
      Simulator__IngestUrl: http://ingest:8080
      Simulator__ApiUrl: http://api:8080
      Simulator__Devices: "25"
      Simulator__Interval: "00:00:01"
    depends_on:
      - ingest
      - api
      - processor
    restart: "no"

volumes:
  redis-data:
  kafka-data:
  postgres-data:
