apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
spec:
  # The two pods share one consumer group, so Kafka splits the topics' partitions between them.
  # Both migrate the schema on start: whichever loses the race rolls back its migration transaction,
  # retries, and finds nothing left to apply.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: analytics
          image: tracking-analytics
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tracking-config
          env:
            - name: ConnectionStrings__Analytics
              valueFrom:
                secretKeyRef:
                  name: analytics-db
                  key: connection-string
          ports:
            - name: http
              containerPort: 8080
          # HTTP starts only after the schema is migrated, and migrating waits for PostgreSQL.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only; .NET still needs a writable temp directory.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
