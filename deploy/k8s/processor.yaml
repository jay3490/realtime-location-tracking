apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: processor
          image: tracking-processor
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tracking-config
          env:
            # Each pod is its own consumer in the group. When a pod goes away, its unacknowledged
            # entries are claimed by the remaining pods once they have been idle for ClaimMinIdle.
            - name: Processor__ConsumerName
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            # Fails only when the consumer loop has stalled, not when Redis is unreachable.
            httpGet:
              path: /healthz/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only; .NET still needs a writable temp directory.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processor
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: processor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
